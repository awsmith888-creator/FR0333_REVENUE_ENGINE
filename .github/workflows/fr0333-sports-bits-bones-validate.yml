name: FR0333 Sports Bits Bones Validate

on:
  pull_request:
    paths:
      - "RavenCloudTaskbar/fr0333_sports_bits_bones_0001.json"
      - "RavenCloudTaskbar/fr0333_sports_bits_bones_genius.py"
      - "RavenCloudTaskbar/test_fr0333_sports_bits_bones_genius.py"
      - "RavenCloudTaskbar/README_sports_bits_bones_0001.md"
      - "RavenCloudTaskbar/fr0333_golden_chain_inventory_0001.json"
      - "RavenCloudTaskbar/README.md"
      - "RavenCloudTaskbar/taskbars.json"
      - "RavenCloudTaskbar/build.py"
      - ".github/workflows/fr0333-sports-bits-bones-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON rails
        run: |
          python -m json.tool RavenCloudTaskbar/fr0333_sports_bits_bones_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_golden_chain_inventory_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/taskbars.json >/dev/null
      - name: Run Sports Bits Bones Genius Bar
        run: python RavenCloudTaskbar/fr0333_sports_bits_bones_genius.py
      - name: Run local test rail
        working-directory: RavenCloudTaskbar
        run: python test_fr0333_sports_bits_bones_genius.py
      - name: Run Raven Taskbar build
        run: python RavenCloudTaskbar/build.py
