name: FR0333 Human Tool Contribution Evidence Validate

on:
  pull_request:
    paths:
      - 'RavenCloudTaskbar/README_human_tool_contribution_evidence.md'
      - 'RavenCloudTaskbar/README_genius_bar_comparability_normalization.md'
      - 'RavenCloudTaskbar/README.md'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_0001.schema.json'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_0001.py'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_fixtures.json'
      - 'RavenCloudTaskbar/test_human_tool_contribution_evidence.py'
      - 'RavenCloudTaskbar/fr0333_transcript_confidence_humanlock_0001.json'
      - 'RavenCloudTaskbar/fr0333_public_benefit_human_centered_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0028.json'
      - 'RavenCloudTaskbar/test_human_centered_extensions.py'
      - 'RavenCloudTaskbar/fr0333_trump_bbc_litigation_evidence_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0029.json'
      - 'RavenCloudTaskbar/test_trump_bbc_litigation_evidence.py'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_normalization_0001.schema.json'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_normalization_0001.py'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_fixtures_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0030.json'
      - 'RavenCloudTaskbar/test_fr0333_genius_bar_comparability_normalization.py'
      - 'RavenCloudTaskbar/human_tool_contribution_evidence_inventory.json'
      - '.github/workflows/fr0333-human-tool-evidence-validate.yml'
  push:
    branches: [main]
    paths:
      - 'RavenCloudTaskbar/README_human_tool_contribution_evidence.md'
      - 'RavenCloudTaskbar/README_genius_bar_comparability_normalization.md'
      - 'RavenCloudTaskbar/README.md'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_0001.schema.json'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_0001.py'
      - 'RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_fixtures.json'
      - 'RavenCloudTaskbar/test_human_tool_contribution_evidence.py'
      - 'RavenCloudTaskbar/fr0333_transcript_confidence_humanlock_0001.json'
      - 'RavenCloudTaskbar/fr0333_public_benefit_human_centered_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0028.json'
      - 'RavenCloudTaskbar/test_human_centered_extensions.py'
      - 'RavenCloudTaskbar/fr0333_trump_bbc_litigation_evidence_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0029.json'
      - 'RavenCloudTaskbar/test_trump_bbc_litigation_evidence.py'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_normalization_0001.schema.json'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_normalization_0001.py'
      - 'RavenCloudTaskbar/fr0333_genius_bar_comparability_fixtures_0001.json'
      - 'RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0030.json'
      - 'RavenCloudTaskbar/test_fr0333_genius_bar_comparability_normalization.py'
      - 'RavenCloudTaskbar/human_tool_contribution_evidence_inventory.json'
      - '.github/workflows/fr0333-human-tool-evidence-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate JSON payloads
        run: |
          python -m json.tool RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_0001.schema.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_human_tool_contribution_evidence_fixtures.json >/dev/null
          python -m json.tool RavenCloudTaskbar/human_tool_contribution_evidence_inventory.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_transcript_confidence_humanlock_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_public_benefit_human_centered_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0028.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_trump_bbc_litigation_evidence_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0029.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_genius_bar_comparability_normalization_0001.schema.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_genius_bar_comparability_fixtures_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_golden_chain_gc_sb_0030.json >/dev/null
      - name: Validate Genius Bar structural schema against finalized record
        run: |
          python - <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          sys.path.insert(0, 'RavenCloudTaskbar')
          from fr0333_genius_bar_comparability_normalization_0001 import finalize_record

          root = Path('RavenCloudTaskbar')
          schema = json.loads((root / 'fr0333_genius_bar_comparability_normalization_0001.schema.json').read_text())
          fixtures = json.loads((root / 'fr0333_genius_bar_comparability_fixtures_0001.json').read_text())
          Draft202012Validator.check_schema(schema)
          record = finalize_record(copy.deepcopy(fixtures['base_record']))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(record)
          PY
      - name: Run deterministic gate tests
        run: |
          cd RavenCloudTaskbar
          python -m unittest -v test_human_tool_contribution_evidence.py test_human_centered_extensions.py test_trump_bbc_litigation_evidence.py test_fr0333_genius_bar_comparability_normalization.py
      - name: Write evidence boundary summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## FR0333 Human-Centered, Litigation, and Genius Bar Evidence Package

          - `FR0333.HUMAN.TOOL.CONTRIBUTION.EVIDENCE.0001` schema and fixtures validate.
          - `FR0333.TRANSCRIPT.CONFIDENCE.HUMANLOCK.0001` v0.12 validates as SPECIFICATION.
          - `FR0333.PUBLIC.BENEFIT.HUMAN.CENTERED.0001` v0.20 validates as SYSTEM.ROOT governing reference.
          - `GC.SB.0028` manifest parses and remains REGISTERED.DRAFT.UNMERGED.
          - `FR0333.TRUMP.BBC.DEFAMATION.LITIGATION.EVIDENCE.0001` validates as an evidence-bounded public-litigation register.
          - `GC.SB.0029` manifest parses and remains REGISTERED.DRAFT.UNMERGED.
          - `FR0333.GENIUS.BAR.COMPARABILITY.NORMALIZATION.0001` Draft 2020-12 structural schema validates against a finalized canonical record.
          - `CANONICAL.JSON.V1 -> UTF8 -> SHA256` comparability-key generation is deterministic under the declared field normalization rules.
          - N.01-N.12 adversarial normalization cases are covered by the Genius Bar suite.
          - The combined deterministic suite expects 53 tests: 10 base + 12 human-centered + 12 litigation + 19 Genius Bar.
          - `EXACT.CANONICAL.DECIMAL.EQUALITY != RAW.BYTE.IDENTITY` remains controlling.
          - `FORMATTING.DIFFERENCE != SEMANTIC.DIFFERENCE` remains controlling.
          - `REVERSIBLE.REPRESENTATION != EXACT.UNDERLYING.TRUTH` remains controlling.
          - `NORMALIZED != COMPARABLE != CONSUMER.COMPATIBLE` remains controlling.
          - Hash-bound deterministic receipts are explicitly not cryptographically signed receipts.
          - CI validates repository contracts only; it does not establish authenticated external runtime enforcement.
          - `GC.SB.0029` must exist in target history before `GC.SB.0030` promotion.
          EOF
