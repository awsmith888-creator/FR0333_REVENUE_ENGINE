name: Raven Cloud Taskbar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RavenCloudTaskbar/**'
      - '.github/workflows/raven-cloud-taskbar.yml'
  push:
    branches: [main]
    paths:
      - 'RavenCloudTaskbar/**'
      - '.github/workflows/raven-cloud-taskbar.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and validate taskbar
        run: python RavenCloudTaskbar/build.py
      - name: Verify no provisioned cloud credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('RavenCloudTaskbar/lumen_gateway.json').read_text())
          assert d['credentials']=='NOT_STORED'
          assert d['provisioning_state']=='NOT_PROVISIONED'
          print('PASS cloud credential boundary')
          PY
      - name: Package taskbar artifact
        run: |
          cd RavenCloudTaskbar
          zip -qr ../FR0333_RAVEN_CLOUD_TASKBAR_v1.zip dist README.md taskbars.json lumen_gateway.json cloud_provider_slots.json build.py
          cd ..
          sha256sum FR0333_RAVEN_CLOUD_TASKBAR_v1.zip > FR0333_RAVEN_CLOUD_TASKBAR_v1.zip.sha256
      - name: Upload taskbar artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR0333-Raven-Cloud-Taskbar-v1
          path: |
            FR0333_RAVEN_CLOUD_TASKBAR_v1.zip
            FR0333_RAVEN_CLOUD_TASKBAR_v1.zip.sha256
          if-no-files-found: error
