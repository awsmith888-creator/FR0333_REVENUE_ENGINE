name: FR0333 Raven Weekly Log

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run both possible ET offsets; the gate below releases only at 3 PM America/New_York.
    - cron: '0 19 * * 5'
    - cron: '0 20 * * 5'

permissions:
  contents: read

jobs:
  weekly-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Friday 3 PM Eastern gate
        id: et_gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              print('run=true')
          else:
              now = datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
              print(f"observed_et={now.isoformat()}")
              print(f"run={'true' if now.weekday() == 4 and now.hour == 15 else 'false'}")
          PY

      - name: Generate FR-0333 weekly log
        if: steps.et_gate.outputs.run == 'true'
        run: python RavenCloudTaskbar/weekly_log.py

      - name: Write summary
        if: steps.et_gate.outputs.run == 'true'
        run: cat RavenCloudTaskbar/dist/fr0333_weekly_log.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly log receipt
        if: steps.et_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FR0333-Raven-Weekly-Log-${{ github.run_id }}
          path: |
            RavenCloudTaskbar/dist/fr0333_weekly_log.md
            RavenCloudTaskbar/dist/fr0333_weekly_log_receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: No-op outside 3 PM Eastern
        if: steps.et_gate.outputs.run != 'true'
        run: echo "Raven weekly log gate closed; this UTC trigger is not 3 PM Eastern."
