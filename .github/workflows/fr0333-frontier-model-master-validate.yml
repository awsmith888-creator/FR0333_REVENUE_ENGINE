name: FR0333 Frontier Model Master Validate

on:
  pull_request:
    paths:
      - "RavenCloudTaskbar/fr0333_frontier_model_master_benchmark_0001.json"
      - "RavenCloudTaskbar/fr0333_frontier_model_mock_fixtures_0001.json"
      - "RavenCloudTaskbar/fr0333_disagreement_register_0001.schema.json"
      - "RavenCloudTaskbar/fr0333_humanlock_compliance_receipt_0001.json"
      - "RavenCloudTaskbar/fr0333_humanlock_authorization_0001.schema.json"
      - "RavenCloudTaskbar/fr0333_humanlock_authorization_simulation_fixture_0001.json"
      - "RavenCloudTaskbar/fr0333_architecture_ai_migration_12step_0001.json"
      - "RavenCloudTaskbar/fr0333_frontier_model_master_validate.py"
      - "RavenCloudTaskbar/test_fr0333_frontier_model_master_validate.py"
      - "RavenCloudTaskbar/fr0333_architecture_ai_migration_12step_validate.py"
      - "RavenCloudTaskbar/test_fr0333_architecture_ai_migration_12step_validate.py"
      - ".github/workflows/fr0333-frontier-model-master-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate JSON artifacts
        run: |
          python -m json.tool RavenCloudTaskbar/fr0333_frontier_model_master_benchmark_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_frontier_model_mock_fixtures_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_disagreement_register_0001.schema.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_humanlock_compliance_receipt_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_humanlock_authorization_0001.schema.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_humanlock_authorization_simulation_fixture_0001.json >/dev/null
          python -m json.tool RavenCloudTaskbar/fr0333_architecture_ai_migration_12step_0001.json >/dev/null
      - name: Run frontier model comparator validator
        run: python RavenCloudTaskbar/fr0333_frontier_model_master_validate.py
      - name: Run frontier model comparator tests
        run: python RavenCloudTaskbar/test_fr0333_frontier_model_master_validate.py
      - name: Run 12-step AI migration validator
        run: python RavenCloudTaskbar/fr0333_architecture_ai_migration_12step_validate.py
      - name: Run 12-step AI migration tests
        run: python RavenCloudTaskbar/test_fr0333_architecture_ai_migration_12step_validate.py
      - name: Verify frozen Stronghold taskbar blob
        run: test "$(git hash-object RavenCloudTaskbar/taskbars.json)" = "056d63083395b5d092a23c4764cc81520acad8cb"
