name: FR0333 Predictive Recovery Tests
on:
  push:
    branches:
      - feature/fr0333-predictive-lane-recovery-v1
  workflow_dispatch:
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated recovery regression suite
        run: python -m unittest discover -s tests -p 'test_fr0333*.py' -v
