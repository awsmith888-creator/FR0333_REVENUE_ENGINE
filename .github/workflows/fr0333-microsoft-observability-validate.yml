name: FR0333 Microsoft Observability Evolution Validate
on:
  pull_request:
    paths:
      - 'RavenCloudTaskbar/fr0333_microsoft_observability_evolution_0001.json'
      - 'RavenCloudTaskbar/fr0333_observability_runtime_0001.py'
      - 'RavenCloudTaskbar/test_fr0333_observability_runtime_0001.py'
      - 'RavenCloudTaskbar/validate_microsoft_observability_evolution_0001.py'
      - 'RavenCloudTaskbar/fr0333_golden_chain_index_0001.json'
      - '.github/workflows/fr0333-microsoft-observability-validate.yml'
permissions:
  contents: read
jobs:
  synthetic-offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and index integrity
        run: python3 RavenCloudTaskbar/validate_microsoft_observability_evolution_0001.py
      - name: Telemetry schema and negative synthetic tests
        run: python3 RavenCloudTaskbar/test_fr0333_observability_runtime_0001.py
