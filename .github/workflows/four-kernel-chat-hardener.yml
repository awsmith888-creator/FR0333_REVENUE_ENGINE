name: Four Kernel Chat Hardener

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/four_kernel_hardener.py"
      - "src/compile_four_kernel_receipt.py"
      - "schemas/four_kernel_transaction.schema.json"
      - "tests/test_four_kernel_hardener.py"
      - "src/four_kernel_hardener_v2.py"
      - "src/compile_four_kernel_receipt_v2.py"
      - "schemas/four_kernel_transaction_v2.schema.json"
      - "tests/test_four_kernel_hardener_v2.py"
      - "src/four_kernel_hardener_v3.py"
      - "src/compile_four_kernel_receipt_v3.py"
      - "schemas/four_kernel_transaction_v3.schema.json"
      - "tests/test_four_kernel_hardener_v3.py"
      - "src/agent_simulation_hardener_0001.py"
      - "src/historical_entity_normalizer_0001.py"
      - "schemas/agent_simulation_hardener_0001.schema.json"
      - "schemas/historical_entity_normalization_0001.json"
      - "tests/test_agent_simulation_hardener_0001.py"
      - "src/severe_variant_steward_0010.py"
      - "schemas/severe_variant_stewardship_0010.json"
      - "tests/test_severe_variant_steward_0010.py"
      - "src/steward_observability_hardener_0011.py"
      - "schemas/steward_observability_hardener_0011.schema.json"
      - "tests/test_steward_observability_hardener_0011.py"
      - "receipts/operator/**"
      - ".github/workflows/four-kernel-chat-hardener.yml"

jobs:
  validate-four-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate hardened transaction schema v2
        run: |
          python -m json.tool schemas/four_kernel_transaction_v2.schema.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/four_kernel.transaction.v2.json >/dev/null
          python - <<'PY'
          import json
          from jsonschema import validate
          schema=json.load(open('schemas/four_kernel_transaction_v2.schema.json', encoding='utf-8'))
          tx=json.load(open('receipts/operator/2026-09-15/four_kernel.transaction.v2.json', encoding='utf-8'))
          validate(instance=tx, schema=schema)
          PY
      - name: Validate provenance hardening schema v3
        run: |
          python -m json.tool schemas/four_kernel_transaction_v3.schema.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/four_kernel.transaction.v3.json >/dev/null
          python - <<'PY'
          import json
          from jsonschema import validate
          schema=json.load(open('schemas/four_kernel_transaction_v3.schema.json', encoding='utf-8'))
          tx=json.load(open('receipts/operator/2026-09-15/four_kernel.transaction.v3.json', encoding='utf-8'))
          validate(instance=tx, schema=schema)
          PY
      - name: Validate agent simulation hardener 0001
        run: |
          python -m json.tool schemas/agent_simulation_hardener_0001.schema.json >/dev/null
          python -m json.tool schemas/historical_entity_normalization_0001.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/agent_simulation.batch.0001.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/historical_entity_resolution.batch.0001.json >/dev/null
          python - <<'PY'
          import json
          from jsonschema import validate
          schema=json.load(open('schemas/agent_simulation_hardener_0001.schema.json', encoding='utf-8'))
          tx=json.load(open('receipts/operator/2026-09-15/agent_simulation.batch.0001.json', encoding='utf-8'))
          validate(instance=tx, schema=schema)
          PY
      - name: Validate ten-lane severe variant stewardship 0010
        run: |
          python -m json.tool schemas/severe_variant_stewardship_0010.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/severe_variant.batch.0010.json >/dev/null
      - name: Validate stewardship observability hardener 0011
        run: |
          python -m json.tool schemas/steward_observability_hardener_0011.schema.json >/dev/null
          python -m json.tool receipts/operator/2026-09-15/steward_observability.batch.0011.json >/dev/null
          python - <<'PY'
          import json
          from jsonschema import validate
          schema=json.load(open('schemas/steward_observability_hardener_0011.schema.json', encoding='utf-8'))
          tx=json.load(open('receipts/operator/2026-09-15/steward_observability.batch.0011.json', encoding='utf-8'))
          validate(instance=tx, schema=schema)
          PY
      - name: Compile four-kernel receipt v1
        run: python src/compile_four_kernel_receipt.py
      - name: Verify deterministic outputs v1
        run: git diff --exit-code -- receipts/operator/2026-09-14/four_kernel.snapshot.json receipts/operator/2026-09-14/four_kernel.receipt.md
      - name: Compile four-kernel receipt v2
        run: python src/compile_four_kernel_receipt_v2.py
      - name: Verify deterministic outputs v2
        run: git diff --exit-code -- receipts/operator/2026-09-15/four_kernel.snapshot.v2.json receipts/operator/2026-09-15/four_kernel.receipt.v2.md
      - name: Compile provenance hardening receipt v3
        run: python src/compile_four_kernel_receipt_v3.py
      - name: Verify deterministic outputs v3
        run: |
          cp receipts/operator/2026-09-15/four_kernel.snapshot.v3.json /tmp/four_kernel.snapshot.v3.json
          cp receipts/operator/2026-09-15/four_kernel.receipt.v3.md /tmp/four_kernel.receipt.v3.md
          python src/compile_four_kernel_receipt_v3.py
          cmp /tmp/four_kernel.snapshot.v3.json receipts/operator/2026-09-15/four_kernel.snapshot.v3.json
          cmp /tmp/four_kernel.receipt.v3.md receipts/operator/2026-09-15/four_kernel.receipt.v3.md
      - name: Run full regression suite
        run: python -m unittest discover tests
