name: FR0333 AI Federal Safety Architecture 2026 Validate

on:
  pull_request:
    paths:
      - 'RavenCloudTaskbar/fr0333_ai_federal_safety_architecture_2026_0001.json'
      - 'RavenCloudTaskbar/fr0333_ai_federal_safety_architecture_validator.py'
      - 'RavenCloudTaskbar/test_fr0333_ai_federal_safety_architecture_validator.py'
      - '.github/workflows/fr0333-ai-federal-safety-architecture-2026-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unpromoted policy architecture
        run: python RavenCloudTaskbar/fr0333_ai_federal_safety_architecture_validator.py
      - name: Run boundary tests
        run: python -m unittest RavenCloudTaskbar/test_fr0333_ai_federal_safety_architecture_validator.py
