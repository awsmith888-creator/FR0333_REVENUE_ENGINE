name: FR0333 Docker Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker version
        run: docker version

      - name: Build FR0333 image
        run: |
          docker build \
            --iidfile image-id.txt \
            -t fr0333-revenue-engine:${GITHUB_SHA} \
            .
          docker image inspect fr0333-revenue-engine:${GITHUB_SHA} > image-inspect.json
          docker save fr0333-revenue-engine:${GITHUB_SHA} -o fr0333-revenue-engine.tar
          sha256sum fr0333-revenue-engine.tar > image-tar.sha256

      - name: Runtime health check
        run: |
          docker run -d --name fr0333-check -p 18080:8080 fr0333-revenue-engine:${GITHUB_SHA}
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz | tee healthz.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs fr0333-check
          exit 1

      - name: Build receipt
        if: always()
        run: |
          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo -n "IMAGE_ID="
            cat image-id.txt 2>/dev/null || true
            echo
            echo -n "TAR_SHA256="
            cut -d' ' -f1 image-tar.sha256 2>/dev/null || true
            echo
          } > FR0333_DOCKER_BUILD_RECEIPT.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fr0333-docker-build-${{ github.sha }}
          path: |
            image-id.txt
            image-inspect.json
            image-tar.sha256
            healthz.json
            FR0333_DOCKER_BUILD_RECEIPT.txt
          if-no-files-found: warn
