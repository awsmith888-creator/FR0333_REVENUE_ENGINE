name: FR0333 Docker Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker version
        run: docker version

      - name: Build FR0333 image
        run: |
          docker build \
            --iidfile image-id.txt \
            -t fr0333-revenue-engine:${GITHUB_SHA} \
            .
          docker image inspect fr0333-revenue-engine:${GITHUB_SHA} > image-inspect.json
          docker save fr0333-revenue-engine:${GITHUB_SHA} -o fr0333-revenue-engine.tar
          sha256sum fr0333-revenue-engine.tar > image-tar.sha256

      - name: Runtime health check
        run: |
          docker run -d --name fr0333-check -p 18080:8080 fr0333-revenue-engine:${GITHUB_SHA}
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz | tee healthz.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs fr0333-check
          exit 1

      - name: Camera package contract check
        run: |
          curl -fsS http://127.0.0.1:18080/camera/package | tee camera-package.json
          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"source_ids":["river-2259"],"source_people_observed":0,"expected_people_output":0,"output_width_px":1080,"output_height_px":1920,"focus_distance_m":3.0}' \
            http://127.0.0.1:18080/camera/validate | tee camera-validate-pass.json

          reject_code=$(curl -sS -o camera-validate-reject.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"source_ids":["river-2259"],"source_people_observed":0,"expected_people_output":1,"allow_subject_carry_from_previous_job":true,"output_width_px":1080,"output_height_px":1920}' \
            http://127.0.0.1:18080/camera/validate)
          test "$reject_code" = "422"

          python - <<'PY'
          import json

          with open('camera-package.json', encoding='utf-8') as f:
              package = json.load(f)
          with open('camera-validate-pass.json', encoding='utf-8') as f:
              valid = json.load(f)

          assert package['unit_system'] == 'SI_METRIC'
          assert package['aspect_ratio'] == '9:16'
          assert package['source_isolation'] == 'ONE_SOURCE_IMAGE_PER_OUTPUT'
          assert package['subject_carry'] == 'BLOCKED_BY_DEFAULT'
          assert valid['status'] == 'PASS'
          assert valid['unit_system'] == 'SI_METRIC'
          assert valid['normalized']['expected_people_output'] == 0
          PY

      - name: Build receipt
        if: always()
        run: |
          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo -n "IMAGE_ID="
            cat image-id.txt 2>/dev/null || true
            echo
            echo -n "TAR_SHA256="
            cut -d' ' -f1 image-tar.sha256 2>/dev/null || true
            echo
          } > FR0333_DOCKER_BUILD_RECEIPT.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fr0333-docker-build-${{ github.sha }}
          path: |
            image-id.txt
            image-inspect.json
            image-tar.sha256
            healthz.json
            camera-package.json
            camera-validate-pass.json
            camera-validate-reject.json
            FR0333_DOCKER_BUILD_RECEIPT.txt
          if-no-files-found: warn
