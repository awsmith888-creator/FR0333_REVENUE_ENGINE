name: Raven Phone Audit APK

on:
  push:
    branches: [ main ]
    paths:
      - 'RavenPhoneAudit/**'
      - '.github/workflows/raven-phone-audit-apk.yml'
  pull_request:
    paths:
      - 'RavenPhoneAudit/**'
      - '.github/workflows/raven-phone-audit-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: RavenPhoneAudit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenPhoneAudit-debug-apk
          path: |
            RavenPhoneAudit/app/build/outputs/apk/debug/app-debug.apk
            RavenPhoneAudit/app-debug.apk.sha256
          if-no-files-found: error
