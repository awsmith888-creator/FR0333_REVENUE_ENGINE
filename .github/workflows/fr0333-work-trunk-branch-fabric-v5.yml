name: FR0333 Work Trunk Branch Fabric V5

on:
  push:
    paths:
      - "src/work_trunk_branch_fabric_v5.py"
      - "tests/test_work_trunk_branch_fabric_v5.py"
      - "schemas/work_trunk_branch_event_v5.schema.json"
      - "receipts/operator/2026-09-20/work_trunk_branch_fabric.receipt.v5.json"
      - ".github/workflows/fr0333-work-trunk-branch-fabric-v5.yml"
  pull_request:
    paths:
      - "src/work_trunk_branch_fabric_v5.py"
      - "tests/test_work_trunk_branch_fabric_v5.py"
      - "schemas/work_trunk_branch_event_v5.schema.json"
      - "receipts/operator/2026-09-20/work_trunk_branch_fabric.receipt.v5.json"
      - ".github/workflows/fr0333-work-trunk-branch-fabric-v5.yml"

permissions:
  contents: read

jobs:
  validate-continuity-fabric-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile continuity fabric
        run: python -m py_compile src/work_trunk_branch_fabric_v5.py
      - name: Run adversarial continuity suite
        run: python -m unittest -v tests.test_work_trunk_branch_fabric_v5
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate JSON artifacts
        run: |
          python -m json.tool schemas/work_trunk_branch_event_v5.schema.json >/dev/null
          python -m json.tool receipts/operator/2026-09-20/work_trunk_branch_fabric.receipt.v5.json >/dev/null
