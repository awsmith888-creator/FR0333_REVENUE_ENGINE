name: FR0333 Image Queue Runtime Validate

on:
  pull_request:
    paths:
      - "RavenCloudTaskbar/fr0333_image_queue_runtime_0001.json"
      - "RavenCloudTaskbar/fr0333_image_queue_runtime.py"
      - "RavenCloudTaskbar/test_fr0333_image_queue_runtime.py"
      - "RavenCloudTaskbar/README_image_queue_runtime_0001.md"
      - "RavenCloudTaskbar/verify_image_queue_live_readback_0001.py"
      - "RavenCloudTaskbar/test_image_queue_live_readback_0001.py"
      - "RavenCloudTaskbar/README_image_queue_live_readback_0001.md"
      - "RavenCloudTaskbar/fr0333_image_queue_metrics_0001.json"
      - ".github/workflows/fr0333-image-queue-runtime-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate queue runtime specification JSON
        run: python -m json.tool RavenCloudTaskbar/fr0333_image_queue_runtime_0001.json >/dev/null
      - name: Load queue runtime dispatcher
        run: python RavenCloudTaskbar/fr0333_image_queue_runtime.py
      - name: Run queue runtime receipt-count tests
        run: python RavenCloudTaskbar/test_fr0333_image_queue_runtime.py
      - name: Install offline image-decoding dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate bounded existing-output readback gate with synthetic fixtures
        run: python RavenCloudTaskbar/test_image_queue_live_readback_0001.py
      - name: Validate immutable historical closure and source hashes
        run: python RavenCloudTaskbar/validate_image_queue_failure_closure_0001.py
      - name: Validate Golden Chain 0.9 metrics and readback linkage
        run: python RavenCloudTaskbar/validate_image_queue_metrics_0001.py
