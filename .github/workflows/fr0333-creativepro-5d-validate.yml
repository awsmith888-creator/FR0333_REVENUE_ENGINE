name: FR0333 CreativePro Adobe 5D Validate

on:
  push:
    paths:
      - 'RavenCloudTaskbar/fr0333_creativepro_adobe_5d_index.json'
      - 'RavenCloudTaskbar/FR0333_GOOGLE_CLOUD_FREE_INDEX_0002.txt'
      - 'RavenCloudTaskbar/FR0333_GOOGLE_CLOUD_FREE_POINTERS_0002.json'
      - 'RavenCloudTaskbar/FR0333_ADOBE_10_ARCHITECTURE.json'
      - 'RavenCloudTaskbar/fr0333_crypto_voice_index.json'
      - 'RavenCloudTaskbar/validate_creativepro_5d.py'
      - 'RavenCloudTaskbar/validate_adobe_5d_calibration.py'
      - 'RavenCloudTaskbar/validate_adobe_studio_kernel_bus.py'
      - 'RavenCloudTaskbar/validate_crypto_voice.py'
      - 'fr0333/adobe_5d_engine.py'
      - 'fr0333/adobe_studio_kernel_bus.py'
      - 'fr0333/adobe_v10_control_plane.py'
      - 'fr0333/crypto_voice_engine.py'
      - 'tests/test_adobe_5d_engine.py'
      - 'tests/test_adobe_studio_kernel_bus.py'
      - 'tests/test_adobe_v10_control_plane.py'
      - '.github/workflows/fr0333-creativepro-5d-validate.yml'
  pull_request:
    paths:
      - 'RavenCloudTaskbar/fr0333_creativepro_adobe_5d_index.json'
      - 'RavenCloudTaskbar/FR0333_GOOGLE_CLOUD_FREE_INDEX_0002.txt'
      - 'RavenCloudTaskbar/FR0333_GOOGLE_CLOUD_FREE_POINTERS_0002.json'
      - 'RavenCloudTaskbar/FR0333_ADOBE_10_ARCHITECTURE.json'
      - 'RavenCloudTaskbar/fr0333_crypto_voice_index.json'
      - 'RavenCloudTaskbar/validate_creativepro_5d.py'
      - 'RavenCloudTaskbar/validate_adobe_5d_calibration.py'
      - 'RavenCloudTaskbar/validate_adobe_studio_kernel_bus.py'
      - 'RavenCloudTaskbar/validate_crypto_voice.py'
      - 'fr0333/adobe_5d_engine.py'
      - 'fr0333/adobe_studio_kernel_bus.py'
      - 'fr0333/adobe_v10_control_plane.py'
      - 'fr0333/crypto_voice_engine.py'
      - 'tests/test_adobe_5d_engine.py'
      - 'tests/test_adobe_studio_kernel_bus.py'
      - 'tests/test_adobe_v10_control_plane.py'
      - '.github/workflows/fr0333-creativepro-5d-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5
      - name: Validate 5D index hardener and Google pointer register
        run: python RavenCloudTaskbar/validate_creativepro_5d.py
      - name: Validate Adobe 5D calibration engine
        run: python RavenCloudTaskbar/validate_adobe_5d_calibration.py
      - name: Validate Adobe Studio K01-K05 coordination bus
        run: python RavenCloudTaskbar/validate_adobe_studio_kernel_bus.py
      - name: Run Adobe Studio kernel bus tests
        run: python -m pytest -q tests/test_adobe_studio_kernel_bus.py
      - name: Validate FR-0333 Adobe 10.0 control plane
        run: python -m pytest -q tests/test_adobe_v10_control_plane.py
      - name: Validate FR-0333 cryptographic voice kernels
        run: python RavenCloudTaskbar/validate_crypto_voice.py
      - name: Compile calibration, Studio bus, Adobe 10.0, and crypto engines
        run: python -m py_compile fr0333/adobe_5d_engine.py fr0333/adobe_studio_kernel_bus.py fr0333/adobe_v10_control_plane.py fr0333/crypto_voice_engine.py RavenCloudTaskbar/validate_creativepro_5d.py RavenCloudTaskbar/validate_adobe_5d_calibration.py RavenCloudTaskbar/validate_adobe_studio_kernel_bus.py RavenCloudTaskbar/validate_crypto_voice.py
