apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fr0333-revenue-engine
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
    spec:
      containerConcurrency: 80
      containers:
        - image: gcr.io/fr0333-production/revenue-engine:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 10
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
